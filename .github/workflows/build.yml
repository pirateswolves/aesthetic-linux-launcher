name: Build Aesthetic Linux APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AestheticLinuxLauncher-AndroidStudio-Project.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q AestheticLinuxLauncher-AndroidStudio-Project.zip -d extracted
          ls -la extracted/AestheticLinuxLauncher

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p extracted/AestheticLinuxLauncher :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aesthetic-Linux-Debug-APK
          path: extracted/AestheticLinuxLauncher/app/build/outputs/apk/debug/app-debug.apk
